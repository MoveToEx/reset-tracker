[project]
name = "reset-tracker"
version = "0.1.0"
description = "Persistent Codex reset notifications with configurable webhook templates"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1,<1",
    "jinja2>=3.1.6,<4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project.scripts]
reset-tracker = "reset_tracker.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/reset_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
