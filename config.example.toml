interval_seconds = 600
request_timeout_seconds = 20
database_path = "/data/reset-tracker.sqlite3"
user_agent = "reset-tracker/0.1.0 (+mailto:${CONTACT_EMAIL})"
providers = ["codex_reset"]

[[webhooks]]
id = "discord"
url = "${DISCORD_WEBHOOK_URL}"
preset = "discord"

